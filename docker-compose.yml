version: "3.8"

services:
  # Optional but recommended: raises Telegram's upload limit from 50MB to 2000MB.
  # Requires TELEGRAM_API_ID / TELEGRAM_API_HASH from https://my.telegram.org
  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      TELEGRAM_API_ID: "${TELEGRAM_API_ID}"
      TELEGRAM_API_HASH: "${TELEGRAM_API_HASH}"
    volumes:
      - bot-api-data:/var/lib/telegram-bot-api

volumes:
  bot-api-data:
