name = "media-downloader-bot"
main = "src/worker.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[vars]
MAX_FILE_SIZE_MB = "50"
# Set these via `wrangler secret put` — do NOT put real values here:
# BOT_TOKEN, ADMIN_IDS, WEBHOOK_URL, DOWNLOAD_SERVICE_URL

[[d1_databases]]
binding = "DB"
database_name = "media-downloader-bot"
database_id   = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

[build]
command = ""

# Secrets (set with wrangler secret put <NAME>):
#   BOT_TOKEN            — Telegram bot token
#   ADMIN_IDS            — Comma-separated admin Telegram IDs
#   WEBHOOK_URL          — https://media-downloader-bot.<subdomain>.workers.dev
#   DOWNLOAD_SERVICE_URL — URL of your Bun VPS downloader (optional, for cache misses)
