name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main, "claude/retry-task-Gn7Qx"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      # ── D1 database (create if not exists, then migrate) ────────────
      - name: Setup D1 database
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: e9928dade1387a975ceeea440a1c0e80
          command: d1 create media-downloader-bot-db
        continue-on-error: true   # silently skip if already exists

      - name: Get D1 database ID
        id: d1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: e9928dade1387a975ceeea440a1c0e80
        run: |
          DB_ID=$(npx wrangler d1 list --json \
            | jq -r '.[] | select(.name == "media-downloader-bot-db") | .uuid // .id' \
            | head -1)

          if [ -z "$DB_ID" ]; then
            echo "::error::D1 database not found"
            exit 1
          fi

          echo "DB_ID=$DB_ID" >> "$GITHUB_OUTPUT"
          echo "✅ DB_ID=$DB_ID"
          sed -i "s/REPLACE_AFTER_D1_CREATE/$DB_ID/" wrangler.toml

      - name: Run D1 migrations
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: e9928dade1387a975ceeea440a1c0e80
          command: d1 execute media-downloader-bot-db --file=migrations/001_init.sql --remote

      # ── Set BOT_TOKEN as Worker secret ──────────────────────────────
      - name: Set BOT_TOKEN secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: e9928dade1387a975ceeea440a1c0e80
        run: |
          echo "${{ secrets.BOT_TOKEN }}" | npx wrangler secret put BOT_TOKEN

      # ── Deploy ──────────────────────────────────────────────────────
      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: e9928dade1387a975ceeea440a1c0e80
          command: deploy

      # ── Register Telegram webhook ───────────────────────────────────
      - name: Register Telegram webhook
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          URL="https://media-downloader-bot.saidmurodjon1020.workers.dev"
          echo "Setting webhook → $URL"
          RESP=$(curl -s -X POST \
            "https://api.telegram.org/bot${BOT_TOKEN}/setWebhook" \
            -d "url=${URL}&drop_pending_updates=true")
          echo "$RESP"
          echo "$RESP" | jq -e '.ok == true' \
            || { echo "::error::setWebhook failed: $RESP"; exit 1; }
          echo "✅ Webhook registered"
